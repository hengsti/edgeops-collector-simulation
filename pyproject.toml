[project]
name = "edgeops-collector-simulation"
version = "0.1.0"
description = "Independent simulation telemetry collector for EdgeOps AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.5,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "types-pyyaml>=6.0,<7",
]

[project.scripts]
edgeops-collector-simulation = "edgeops_collector_simulation.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeops_collector_simulation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
