schema_version: 2
id: malformed-sensor-payload
description: Decode, validation, transform, and DLQ failures with overlapping severity.
phases:
  - id: normal
    duration_seconds: 120
  - id: malformed-payloads
    duration_seconds: 180
  - id: recovery
    duration_seconds: 120
variants:
  mild:
    incident_duration_multiplier: {min: 0.75, max: 0.95}
    effects:
      counter_rate_additions:
        ingest_incoming_invalid_json_total: {min: 0.02, max: 0.15}
        ingest_validate_raw_failed_total: {min: 0.01, max: 0.10}
        ingest_transform_failed_total: {min: 0.00, max: 0.02}
        dlq_messages_published_total: {min: 0.00, max: 0.08}
      service_logs:
        ingestion-service: ["WARN sparse malformed payloads"]
  degraded:
    incident_duration_multiplier: {min: 0.90, max: 1.15}
    effects:
      counter_rate_multipliers:
        ingest_transform_success_total: {min: 0.65, max: 0.90}
      counter_rate_additions:
        ingest_incoming_non_utf8_total: {min: 0.05, max: 0.30}
        ingest_incoming_invalid_json_total: {min: 0.15, max: 0.60}
        ingest_validate_raw_failed_total: {min: 0.10, max: 0.45}
        ingest_transform_failed_total: {min: 0.02, max: 0.10}
        ingest_validate_business_failed_total: {min: 0.05, max: 0.35}
        dlq_messages_published_total: {min: 0.10, max: 0.50}
      service_logs:
        ingestion-service: ["ERROR malformed payload validation failures"]
  severe:
    incident_duration_multiplier: {min: 1.10, max: 1.35}
    effects:
      counter_rate_multipliers:
        ingest_transform_success_total: {min: 0.35, max: 0.70}
      counter_rate_additions:
        ingest_incoming_oversized_total: {min: 0.20, max: 0.80}
        ingest_incoming_non_utf8_total: {min: 0.20, max: 0.90}
        ingest_incoming_invalid_json_total: {min: 0.50, max: 1.60}
        ingest_validate_raw_failed_total: {min: 0.40, max: 1.30}
        ingest_transform_failed_total: {min: 0.05, max: 0.20}
        ingest_transform_deserialize_failed_total: {min: 0.20, max: 0.90}
        ingest_validate_business_failed_total: {min: 0.25, max: 1.00}
        dlq_messages_published_total: {min: 0.50, max: 1.80}
      service_logs:
        ingestion-service: ["ERROR malformed payload and DLQ pressure"]
